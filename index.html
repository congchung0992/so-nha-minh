<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f6b78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ Nhà Mình">
<title>Sổ Nhà Mình</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0} img{max-width:100%} [hidden]{display:none!important}
/* Layout: sổ tay một cột; dải đầu trang màu xanh đậm ôm thẻ số dư, nội dung là các khối trắng bo tròn; icon hạng mục là ô màu nhạt chứa hình vẽ nét */
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f3f5f8; --line:#e1e6ec;
  --fg:#16202b; --muted:#6a7684;
  --brand:#0f6b78; --brand-2:#14928f; --brand-ink:#ffffff;
  --accent:#0f6b78; --accent-ink:#ffffff; --accent-soft:#dcf0f0;
  --income:#16a06a; --expense:#e0533d; --transfer:#5b6be0;
  --warn-bg:#fff3d6; --warn-fg:#7a5300;
  --shadow:0 1px 2px rgba(16,32,48,.05),0 6px 20px rgba(16,32,48,.06);
  /* 2 cỡ chữ của cả app: chữ to (tiêu đề, số nổi bật) · chữ thường (mọi chữ còn lại).
     Số tiền cỡ đại = bội số của chữ to. */
  --fs-lg:17px; --fs-md:15px;
  --f:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1419; --surface:#172028; --surface-2:#1e2932; --line:#2a3640;
  --fg:#e7edf2; --muted:#93a1ad;
  --brand:#0d4f59; --brand-2:#127873; --brand-ink:#ffffff;
  --accent:#4cc3bd; --accent-ink:#06211f; --accent-soft:#163a3b;
  --income:#3fd08f; --expense:#ff8169; --transfer:#9aa6ff;
  --warn-bg:#3a2f17; --warn-fg:#f2cf86;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1419; --surface:#172028; --surface-2:#1e2932; --line:#2a3640;
  --fg:#e7edf2; --muted:#93a1ad;
  --brand:#0d4f59; --brand-2:#127873; --brand-ink:#ffffff;
  --accent:#4cc3bd; --accent-ink:#06211f; --accent-soft:#163a3b;
  --income:#3fd08f; --expense:#ff8169; --transfer:#9aa6ff;
  --warn-bg:#3a2f17; --warn-fg:#f2cf86;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:var(--fs-md);line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
/* ô nhập ≥16px để iOS không tự phóng to khi chạm vào; manipulation chặn kích đúp để zoom */
input,select,textarea{font-size:max(16px,1em)}
html{touch-action:manipulation}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.band{background:linear-gradient(160deg,var(--brand) 0%,var(--brand-2) 100%);color:var(--brand-ink);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 64px;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;right:-60px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),rgba(255,255,255,0) 70%);pointer-events:none}
.band .in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative}
.band h1{margin:0;font-size:var(--fs-lg);font-weight:800;letter-spacing:-.01em}
.band .sub{font-size:var(--fs-md);opacity:.8}
.wrap{max-width:560px;margin:-50px auto 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px;display:flex;flex-direction:column;gap:14px;position:relative}
h2{font-weight:700;font-size:var(--fs-lg);margin:0;text-wrap:balance}
.label{font-size:var(--fs-md);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.card{background:var(--surface);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:var(--fs-md)}
.in-c{color:var(--income)} .out-c{color:var(--expense)} .tr-c{color:var(--transfer)}
.link{background:none;border:0;color:var(--accent);font-weight:700;font-size:var(--fs-md);padding:4px}

/* Icon */
.ico{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 15%,var(--surface));color:var(--c)}
.ico svg{width:58%;height:58%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico.sm{width:32px;height:32px;border-radius:10px}
/* icon nhiều màu (Fluent Emoji): nền nhạt theo màu hạng mục, hình to hơn icon nét một chút */
.ico.emo{background:color-mix(in srgb,var(--c) 20%,var(--surface))} .ico.emo img{width:64%;height:64%;display:block}
.ico.lg{width:52px;height:52px;border-radius:17px}
.ico.solid{background:var(--c);color:#fff}
.ico.av{font-size:12px;font-weight:800;letter-spacing:.02em} .ico.lg.av{font-size:17px}

/* Thẻ số dư */
.balance{background:var(--surface);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.balance .big{font-size:calc(var(--fs-lg) * 1.9);font-weight:800;letter-spacing:-.02em;line-height:1.1;word-break:break-word}
.balance .nw{display:flex;flex-direction:column;gap:6px;font-size:var(--fs-md);border-top:1px solid var(--line);padding-top:10px}
.balance .nw > div{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.balance .nw span{color:var(--muted)}
.balance .nw b{font-weight:700;white-space:nowrap}
.balance .nw .nwbtn{display:flex;align-items:baseline;gap:8px;width:100%;background:none;border:0;padding:4px 0;margin:-4px 0;text-align:left;font-size:inherit;transition:opacity .2s}
.balance .nw .nwbtn span:first-child{flex:1}
.balance .nw .nwbtn .chev{font-size:16px;line-height:1}
.balance .nw .nwbtn:active{opacity:.6}
.balance .nw .nwh{display:flex;justify-content:space-between;align-items:baseline;font-size:var(--fs-md);letter-spacing:.07em;font-weight:800;color:var(--muted);padding-top:4px}
.balance .nw .nwh b{font-size:var(--fs-md);letter-spacing:0;color:var(--fg)}
.balance .nw .nwh.debt{border-top:1px dashed var(--line);padding-top:10px;margin-top:4px}
.balance .nw .nwbtn span:first-child{padding-left:10px}
.wlhead{background:none;border:0;width:100%;text-align:left;padding:0;color:inherit}
.wlhead .chev{font-size:18px}
.nw.wl{display:flex;flex-direction:column;gap:6px;font-size:var(--fs-md);border-top:1px solid var(--line);padding-top:10px}
.nw.wl > div{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.nw.wl span{color:var(--muted)} .nw.wl b{font-weight:700;white-space:nowrap}
.nw.wl .tot{border-top:1px dashed var(--line);padding-top:6px} .nw.wl .tot span{color:var(--fg);font-weight:700}
.debtlist .tx .mid .t{white-space:normal;overflow-wrap:anywhere}
.balance .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.balance .pair > div{border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;min-width:0;background:var(--surface-2)}
.balance .pair b{display:block;white-space:nowrap;font-size:min(var(--fs-lg),4.4vw);word-break:break-word}
.balance .pair span{font-size:var(--fs-md);color:var(--muted)}
.balance .pair span.arrow{color:#fff}
.arrow{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
.arrow svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* Ví cuộn ngang */
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px;scroll-snap-type:x proximity}
.hscroll::-webkit-scrollbar{display:none}
.wcard{flex:none;width:150px;border-radius:16px;padding:12px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px;scroll-snap-align:start;border:0;text-align:left}
.wcard .n{font-size:var(--fs-md);color:var(--muted);overflow-wrap:anywhere}
.wcard b{font-size:var(--fs-md);word-break:break-word}

/* Donut */
.donutwrap{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
@media (max-width:360px){.donutwrap{grid-template-columns:1fr;justify-items:center}}
.donut{position:relative;width:132px;height:132px}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:var(--fs-md);color:var(--muted);line-height:1.2}
.donut .ctr b{display:block;font-size:var(--fs-md);color:var(--fg)}
.leg{display:flex;flex-direction:column;gap:8px;min-width:0;width:100%}
.leg .r{display:flex;align-items:center;gap:8px;font-size:var(--fs-md);min-width:0}
.leg .r .t{flex:1;min-width:0;overflow-wrap:anywhere}
.leg i{width:10px;height:10px;border-radius:3px;flex:none}
.leg .r{flex-wrap:wrap;row-gap:0}
.leg button.r{background:none;border:0;padding:2px 0;margin:-2px 0;width:100%;text-align:left;color:inherit;border-radius:8px;transition:opacity .2s}
.leg button.r:active{opacity:.6}
@keyframes flash{0%,100%{background:transparent}30%{background:var(--accent-soft)}}
.flash{animation:flash 1.2s ease;border-radius:12px}
/* thu = xanh, chi = đỏ: số tiền đặt trên nền nhạt cùng tông */
.tx .amt.in-c,.tx .amt.out-c,.tx .amt.tr-c{padding:3px 9px;border-radius:9px;background:color-mix(in srgb,currentColor 13%,transparent)}
.catrow b.in-c,.catrow b.out-c{font-weight:800}
.dayhead .num.in-c,.dayhead .num.out-c{font-weight:700}
.seg.plain button[data-k="expense"][aria-pressed="true"]{background:var(--expense);color:#fff}
.seg.plain button[data-k="income"][aria-pressed="true"]{background:var(--income);color:#fff}
.kindhead.k-expense .amountbox{background:color-mix(in srgb,var(--expense) 10%,var(--surface-2))}
.kindhead.k-income .amountbox{background:color-mix(in srgb,var(--income) 10%,var(--surface-2))}
.kindhead.k-transfer .amountbox{background:color-mix(in srgb,var(--transfer) 10%,var(--surface-2))}
.kindhead .amountbox{transition:background-color .25s}
.catsearch{position:relative}
.catsearch svg{position:absolute;left:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;pointer-events:none}
.catsearch .input{padding-left:38px;border-radius:14px;background:var(--surface-2);border-color:transparent}
.catbtn[hidden]{display:none!important}
.mergebox{display:flex;flex-direction:column;gap:8px;padding:10px;margin:2px 0 8px;border-radius:12px;background:var(--surface-2)}
/* chi tiêu 12 tháng: mỗi tháng một thanh ngang chia màu */
.trend{display:flex;flex-direction:column;gap:8px}
.trow{display:grid;grid-template-columns:60px 1fr 64px;align-items:center;gap:8px;background:none;border:0;padding:0;color:inherit;text-align:left}
.trow .tm{font-size:var(--fs-md);color:var(--muted);font-weight:700}
.trow .track{height:16px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.trow .sbar{display:flex;height:100%;border-radius:6px;overflow:hidden;gap:1px;transform-origin:left}
.trow .sbar i{display:block;height:100%}
.trow b{text-align:right;font-size:var(--fs-md)}
.tag.mx{background:color-mix(in srgb,#a259ff 18%,transparent);color:#a259ff} .leg.kids{border-left:2px solid var(--line);padding-left:10px;margin:0 0 6px 4px}
.leg .more .chev{font-size:11px;margin-left:4px} .leg.morelist{border-left:2px solid var(--line);padding-left:10px;margin:2px 0 0 4px}
.trow.cur .tm{color:var(--accent)} .trow.cur .track{box-shadow:0 0 0 2px var(--accent)}
#view.enter .trow .sbar{animation:grow .7s var(--ease-out) both;animation-delay:.15s}
.tag{font-style:normal;font-size:var(--fs-md);font-weight:700;border-radius:6px;padding:1px 5px;margin-left:4px;vertical-align:1px}
.tag.fx{background:color-mix(in srgb,#4f8ef7 18%,transparent);color:#4f8ef7} .tag.vr{background:color-mix(in srgb,#f5a524 18%,transparent);color:#d48a0c}
.fxsum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fxsum > div{border-radius:14px;padding:10px 12px;background:var(--surface-2);border-left:4px solid var(--c);display:flex;flex-direction:column;gap:2px}
.fxsum span{font-size:var(--fs-md);color:var(--muted)} .fxsum b{font-size:var(--fs-lg)} .fxsum small{font-size:var(--fs-md);color:var(--muted);font-weight:600} .fxsum em{font-style:normal;font-size:var(--fs-md);color:var(--muted)}
.leg .lv{flex-basis:100%;font-size:var(--fs-md);color:var(--muted);padding-left:18px}

/* Giao dịch */
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border-radius:16px;padding:6px;box-shadow:var(--shadow)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:0;background:var(--surface-2);display:grid;place-items:center}
.iconbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.monthbar strong{font-size:var(--fs-lg)}
.dayhead{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 2px;font-size:var(--fs-md);color:var(--muted);font-weight:600}
.dayhead .d{display:flex;align-items:center;gap:8px}
.dayhead .d b{font-size:var(--fs-lg);color:var(--fg);font-weight:800}
.tx{display:flex;align-items:center;gap:12px;padding:8px 0;background:none;border:0;text-align:left;width:100%}
.tx + .tx{border-top:1px solid var(--line)}
.tx .mid{flex:1;min-width:0}
.tx .mid .t{font-weight:600;overflow-wrap:anywhere}
.tx .mid .s{font-size:var(--fs-md);color:var(--muted);overflow-wrap:anywhere}
.tx .amt{font-weight:700;white-space:nowrap}
.menuitem{display:flex;align-items:center;gap:12px;padding:10px 0;background:none;border:0;width:100%;text-align:left}
.menuitem + .menuitem{border-top:1px solid var(--line)}
.menuitem .mid{flex:1;min-width:0}
.menuitem .s{font-size:var(--fs-md);color:var(--muted)}
.chev{color:var(--muted);font-size:20px}

/* Tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in-tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end}
nav.tabs button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:var(--fs-md);color:var(--muted);font-weight:600;white-space:nowrap;letter-spacing:-.01em}
nav.tabs button svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .add{transform:translateY(-16px)}
nav.tabs .add span.plus{width:56px;height:56px;border-radius:50%;background:linear-gradient(160deg,var(--brand),var(--brand-2));color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(15,107,120,.35);border:4px solid var(--surface)}
nav.tabs .add span.plus svg{width:26px;height:26px;stroke-width:2.6}

/* Form */
.kindhead{border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--surface);box-shadow:var(--shadow)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:11px;padding:9px 4px;font-weight:700;color:var(--muted);font-size:var(--fs-md)}
.seg button[aria-pressed="true"]{color:#fff}
.seg button[aria-pressed="true"][data-k="expense"]{background:var(--expense)}
.seg button[aria-pressed="true"][data-k="income"]{background:var(--income)}
.seg button[aria-pressed="true"][data-k="transfer"]{background:var(--transfer)}
.seg.plain button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.amountbox{display:flex;align-items:baseline;gap:6px;border-radius:14px;padding:10px 14px;background:var(--surface-2)}
.amountbox input{flex:1;min-width:0;border:0;background:transparent;font-weight:800;font-size:calc(var(--fs-lg) * 2);letter-spacing:-.02em;padding:0;outline:none;text-align:right}
.amountbox span{font-size:var(--fs-lg);color:var(--muted);font-weight:700}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:var(--fs-md);font-weight:600;white-space:nowrap;flex:none}
/* chọn nhiều */
/* vuốt để xoá */
.swipe{position:relative;overflow:hidden;border-radius:12px}
.swipe.txw + .swipe.txw{border-top:1px solid var(--line)}
.swipe > .tx,.swipe > .catrow{position:relative;z-index:1;background:var(--surface);touch-action:pan-y;transition:transform .22s var(--ease-out),background-color .15s}
.swipe > .tx.dragging,.swipe > .catrow.dragging{transition:none}
.swipe > .tx + .tx{border-top:0}
.swipe .sdel{position:absolute;inset:2px 0;border-radius:12px;background:var(--expense);color:#fff;font-weight:800;font-size:var(--fs-md);display:flex;align-items:center;justify-content:flex-end;padding-right:22px;opacity:.55;transition:opacity .15s}
.swipe.armed .sdel{opacity:1}
.swipe{transition:height .25s var(--ease-out),opacity .25s} .swipe.gone{height:0!important;opacity:0}
.toast{display:flex;align-items:center;gap:12px} .toast .undo{border:0;background:none;color:var(--accent-soft);font-weight:800;padding:2px 0;text-decoration:underline}
.listhead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 2px}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px 6px}
/* nhập nhanh */
.tpl{flex:none;display:flex;align-items:center;gap:8px;max-width:220px;padding:8px 12px 8px 8px;border-radius:14px;border:1px solid var(--line);background:color-mix(in srgb,var(--c) 8%,var(--surface));text-align:left;color:inherit}
.tpl > span:not(.ico){display:flex;flex-direction:column;min-width:0;line-height:1.25} .tpl b{font-weight:600;overflow-wrap:anywhere}
.ico.xs{width:22px;height:22px;border-radius:7px}
.datechips{margin-top:6px} .datechips .chip{padding:4px 12px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.fq{display:inline-flex;align-items:center;gap:6px;padding:4px 12px 4px 4px}
.chip.fq[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 18%,var(--surface));border-color:var(--c);color:inherit}
.freqrow{display:flex;flex-direction:column;gap:6px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.notesugg{display:flex;flex-direction:column;margin-top:6px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.notesugg button{display:flex;align-items:center;gap:8px;padding:9px 10px;border:0;background:var(--surface-2);color:inherit;text-align:left}
.notesugg button + button{border-top:1px solid var(--line)} .notesugg span:not(.ico){flex:1;min-width:0;overflow-wrap:anywhere} .notesugg em{font-style:normal;color:var(--muted);flex:none}

.cgroup[aria-expanded="true"]{background:var(--surface-2)}

:root{--ease-out:cubic-bezier(.2,.8,.2,1);--ease-spring:cubic-bezier(.34,1.56,.64,1)}

#view.enter .catgrid .catbtn .ico,#view.enter .hscroll .wcard{animation:pop .4s var(--ease-spring) both;animation-delay:calc(.12s + var(--j,0) * 22ms)}

.btn:active:not(:disabled),.chip:active,.iconbtn:active,.wcard:active,.picker button:active{transform:scale(.96)}
.tx:active,.menuitem:active{transform:scale(.985)}

function balances(){
  const b = {}; S.wallets.forEach(w=>b[w.id]=Number(w.initial)||0);
  for (const t of S.txs){
    const a = Number(t.amount)||0;
    if (t.kind==="income") b[t.walletId]=(b[t.walletId]||0)+a;
    else if (t.kind==="expense") b[t.walletId]=(b[t.walletId]||0)-a;
    else if (t.kind==="transfer"){ b[t.walletId]=(b[t.walletId]||0)-a; b[t.toWalletId]=(b[t.toWalletId]||0)+a; }
  }
  return b;
}
/* nợ theo hạng mục: "Đi vay" (thu) trừ "Trả nợ" (chi) là đang nợ; "Cho vay" (chi) trừ "Thu nợ" (thu) là người khác nợ mình */
function debtKind(c){ if(!c) return null; const s=strip(c.name)+" | "+strip(c.parent||"");
  if (/\bdi vay\b|^vay\b/.test(s)) return "borrow"; if (/\btra no\b/.test(s)) return "repay";
  if (/\bcho vay\b/.test(s)) return "lend"; if (/\bthu no\b/.test(s)) return "collect"; return null; }
function debts(){
  const k={borrow:0,repay:0,lend:0,collect:0};
  for (const t of S.txs){ if(t.kind==="transfer") continue; const d=debtKind(catById(t.categoryId)); if(d) k[d]+=Number(t.amount)||0; }
  return { owe:Math.max(0,k.borrow-k.repay), owed:Math.max(0,k.lend-k.collect) };
}
/* thu chi thật: bỏ chuyển giữa ví, đi vay / cho vay / trả nợ / thu nợ và điều chỉnh số dư (chỉ là tiền đổi chỗ, không phải kiếm được hay tiêu mất) */
const isAdjust = t => /dieu chinh so du/.test(strip(t.note));
const isInternalCat = c => !!c && /chuyen giua tai khoan/.test(strip(c.name));
const isRealFlow = t => { if (t.kind!=="income" && t.kind!=="expense") return false; const c=catById(t.categoryId); return !debtKind(c) && !isInternalCat(c) && !isAdjust(t); };
function monthTotals(ym){ let inc=0, exp=0; for (const t of S.txs){ if (ymOf(t.date)!==ym || !isRealFlow(t)) continue; if(t.kind==="income") inc+=+t.amount; else exp+=+t.amount; } return {inc, exp}; }
function byCategory(ym, kind){ const m={}; S.txs.forEach(t=>{ if(t.kind===kind && ymOf(t.date)===ym && isRealFlow(t)) m[t.categoryId]=(m[t.categoryId]||0)+(+t.amount); }); return Object.entries(m).sort((a,b)=>b[1]-a[1]); }
const sortTx = arr => arr.slice().sort((a,b)=> a.date===b.date ? (b.createdAt||0)-(a.createdAt||0) : (a.date<b.date?1:-1));

/* hiệu ứng vào màn: chỉ khi đổi sang màn khác (key khác); cùng màn mà vẽ lại thì hiện ngay, không nháy */
let lastViewKey=null, enterT=null;
function enterView(key){
  const v=$("#view"); if(!v) return;
  if (key!=null && key===lastViewKey){ v.classList.remove("enter"); return; }

  v.classList.remove("enter"); void v.offsetWidth; v.classList.add("enter");
  clearTimeout(enterT); enterT=setTimeout(()=>v.classList.remove("enter"),1400);

/* số dư chạy từ 0 lên giá trị thật */
function countUp(el){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const txt=el.textContent, n=Number(txt.replace(/[^\d]/g,"")); if(!n) return;
  const neg=/^[−-]/.test(txt.trim()), t0=performance.now(), dur=750;
  const step=now=>{ if(!el.isConnected) return; const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3);
    el.textContent=money((neg?-1:1)*Math.round(n*e)); if(k<1) requestAnimationFrame(step); else el.textContent=txt; };
  requestAnimationFrame(step);
}

async function seedDefaults(){

async function addMissingDefaults(){

function handleWriteErr(e){
  const c = e && e.code;
  if (c==="invalid_argument"){ S.canWrite=false; toast("Bạn không còn là thành viên của sổ này. Đăng nhập lại."); render(); }
  else if (c==="in_use") toast("Ví hoặc hạng mục này đang được dùng trong ghi chép nên chưa xoá được.");
  else if (c==="bad_data") toast("Dữ liệu chưa hợp lệ, kiểm tra lại số tiền và ngày.");
  else if (c==="quota_exceeded") toast("Sổ đã đầy dung lượng. Hãy xoá bớt giao dịch cũ.");
  else if (c==="resource_exhausted") toast("Thao tác hơi nhanh, đợi vài giây rồi thử lại.");
  else toast("Chưa lưu được. Kiểm tra mạng rồi thử lại.");
}
const strip0 = o => { const c={...o}; delete c.id; return c; };

/* ---------- donut ---------- */
/* màu biểu đồ theo thứ hạng (không theo icon) để các lát cạnh nhau luôn khác màu; từ hạng 7 trở đi là xám "khác" */
const CHART_COLORS=["#4f8ef7","#f5a524","#2fbf71","#a259ff","#22b8cf","#ff6fb5"], CHART_REST="#9aa4ae";
const rankColor = i => CHART_COLORS[i] || CHART_REST;
function donut(rows, total, center){
  const R=52, C=2*Math.PI*R; let off=0; let arcs="";
  const top=rows.slice(0,6); const rest=rows.slice(6).reduce((s,r)=>s+r[1],0);
  const parts=top.map(([id,v],i)=>({v,c:rankColor(i)})); if(rest>0) parts.push({v:rest,c:CHART_REST});
  if (!total) arcs=`<circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="18"/>`;
  else { arcs=`<circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--surface-2)" stroke-width="18"/>`;
    parts.forEach(p=>{ const len=p.v/total*C; const gap=parts.length>1?Math.min(2,len/3):0; arcs+=`<circle cx="66" cy="66" r="${R}" fill="none" stroke="${p.c}" stroke-width="18" stroke-dasharray="${Math.max(0,len-gap)} ${C}" stroke-dashoffset="${-off}"/>`; off+=len; }); }
  return `<div class="donut"><svg viewBox="0 0 132 132">${arcs}</svg><div class="ctr"><div>${center}</div></div></div>`;
}
function legend(rows,total,limit=5){
  if(!rows.length) return `<p class="muted small" style="margin:0">Chưa có khoản chi nào trong tháng.</p>`;
  return `<div class="leg">${rows.slice(0,limit).map(([id,v],i)=>{ const c=catById(id); return `<button class="r" data-catd="${esc(id)}"><i style="background:${rankColor(i)}"></i><span class="t">${esc(c?.name||"Không rõ")}</span><b class="num small">${Math.round(v/total*100)}%</b></button>`; }).join("")}</div>`;
}

/* mọi khoản ra vào một ví, mới nhất ở trên, kèm số dư sau mỗi khoản */
function walletTxView(id){
  const w=walletById(id); if(!w){ S.homeSub="wallets"; return walletsDetailView(); }
  const lines=[];
  for (const t of S.txs){ const a=+t.amount||0;
    if (t.kind==="transfer"){ if(t.walletId===id) lines.push({t,d:-a,title:"Chuyển sang "+(walletById(t.toWalletId)?.name||"ví khác")}); else if(t.toWalletId===id) lines.push({t,d:a,title:"Chuyển từ "+(walletById(t.walletId)?.name||"ví khác")}); }
    else if (t.walletId===id) lines.push({t,d:t.kind==="income"?a:-a,title:catById(t.categoryId)?.name||"Không rõ hạng mục"}); }
  lines.sort((x,y)=> x.t.date===y.t.date ? (x.t.createdAt||0)-(y.t.createdAt||0) : (x.t.date<y.t.date?-1:1));
  let bal=Number(w.initial)||0; lines.forEach(l=>{ bal+=l.d; l.bal=bal; }); lines.reverse();
  const groups={}; lines.forEach(l=>(groups[l.t.date]=groups[l.t.date]||[]).push(l));
  $("#view").innerHTML = `<div class="listhead"><button class="chip" id="back">‹ Các ví</button></div>

  ${lines.length ? Object.keys(groups).map(d=>`<section class="card" style="gap:4px"><div class="dayhead"><span class="d"><b>${d.slice(8)}</b><span>${weekday(d)}<br>${monthLabel(d.slice(0,7))}</span></span></div><div class="list-plain">${groups[d].map(l=>{ const c=catById(l.t.categoryId);

function homeView(){

function catTrendView(cid){

  const total=per.reduce((s,p)=>s+p.sum,0), withM=per.filter(p=>p.sum>0).length||1, max=Math.max(1,...per.map(p=>p.sum));
  const allExp=months.reduce((s,m)=>s+monthTotals(m).exp,0);
  if (!S.catTrendM || !months.includes(S.catTrendM)) S.catTrendM=[...per].reverse().find(p=>p.sum>0)?.m||ym;
  const sel=per.find(p=>p.m===S.catTrendM), col=rankColor(0), fixed=isFixedCat(c);

    <div class="nw"><div><span>Trung bình mỗi tháng</span><b class="num">${money(Math.round(total/withM))}</b></div>
    <div><span>Chiếm trong tổng chi ${N} tháng</span><b class="num">${allExp?(total/allExp*100).toFixed(1).replace(".",","):0}%</b></div>
    <div><span>Tháng chi nhiều nhất</span><b class="num">${(()=>{ const b=[...per].sort((a,b)=>b.sum-a.sum)[0]; return b.sum?monthLabel(b.m)+" · "+shortMoney(b.sum):"–"; })()}</b></div></div></section>
  <section class="card"><h2>Theo từng tháng</h2><div class="trend">${per.map(p=>`<button class="trow ${p.m===S.catTrendM?"cur":""}" data-ctm="${p.m}"><span class="tm">T${Number(p.m.slice(5))}/${p.m.slice(2,4)}</span><span class="track"><span class="sbar" style="width:${p.sum/max*100}%"><i style="width:100%;background:${col}"></i></span></span><b class="num">${p.sum?shortMoney(p.sum):"–"}</b></button>`).join("")}</div>
    <p class="small muted" style="margin:0">Bấm vào một tháng để xem các khoản bên dưới.</p></section>
  <section class="card" style="gap:4px"><div class="row between"><h2>${monthLabel(sel.m)}</h2><span class="small muted">${sel.l.length} khoản · <b class="num out-c">${fmt(sel.sum)}</b></span></div>

/* ---------- chi tiêu 12 tháng: theo hạng mục / cố định – phát sinh ---------- */
const FIXED_RE=/thue nha|tien nha|\bdien\b|tien dien|\bnuoc\b|tien nuoc|internet|wifi|truyen hinh|dien thoai|hoc phi|bao hiem|lai vay|tra gop|gui xe|\bgas\b|phi quan ly|dich vu sinh hoat/;
const isFixedCat = c => !!c && (c.fixed===true || (c.fixed!==false && FIXED_RE.test(strip(c.name)+" | "+strip(c.parent||""))));

  const grand=per.reduce((s,p)=>s+p.tot,0);

  const catTot={}; per.forEach(p=>Object.entries(p.rows).forEach(([id,v])=>catTot[id]=(catTot[id]||0)+v));
  const ranked=Object.entries(catTot).sort((a,b)=>b[1]-a[1]);
  // gom hạng mục con vào hạng mục cha: "Ăn uống" = Ăn uống + Đi chợ/siêu thị + Ăn sáng…
  const groupOf=id=>{ const c=catById(id); return (c?.parent||c?.name||"Không rõ").trim(); };
  const gTot={}, gKids={}; ranked.forEach(([id,v])=>{ const g=groupOf(id); gTot[g]=(gTot[g]||0)+v; (gKids[g]=gKids[g]||[]).push([id,v]); });
  per.forEach(p=>{ p.g={}; Object.entries(p.rows).forEach(([id,v])=>{ const g=groupOf(id); p.g[g]=(p.g[g]||0)+v; }); });
  const granked=Object.entries(gTot).sort((a,b)=>b[1]-a[1]); const top=granked.slice(0,6).map(r=>r[0]);
  const colorOf=g=>{ const i=top.indexOf(g); return i<0?CHART_REST:rankColor(i); };
  const max=Math.max(...per.map(p=>p.tot),1), months_with=per.filter(p=>p.tot>0).length||1;
  const fixAll=per.reduce((s,p)=>s+p.fix,0), varAll=grand-fixAll;
  const pct=v=>{ const p=v/grand*100; return p.toFixed(p<10?1:0).replace(".",",")+"%"; };

  const bars=per.map(p=>{ let segs="";
    if (mode==="cat"){ const parts=top.map(g=>[colorOf(g),p.g[g]||0]); parts.push([CHART_REST,p.tot-top.reduce((s,g)=>s+(p.g[g]||0),0)]); segs=parts.filter(x=>x[1]>0).map(([c,v])=>`<i style="width:${v/p.tot*100}%;background:${c}"></i>`).join(""); }
    else segs=[[FIX_C,p.fix],[VAR_C,p.tot-p.fix]].filter(x=>x[1]>0).map(([c,v])=>`<i style="width:${v/p.tot*100}%;background:${c}"></i>`).join("");
    return `<button class="trow" data-trend-m="${p.m}"><span class="tm">T${Number(p.m.slice(5))}/${p.m.slice(2,4)}</span><span class="track"><span class="sbar" style="width:${p.tot/max*100}%">${segs}</span></span><b class="num">${p.tot?shortMoney(p.tot):"–"}</b></button>`; }).join("");
  const tagOf = ids => { const f=ids.filter(id=>isFixedCat(catById(id))).length; return f===ids.length?`<em class="tag fx">Cố định</em>`:f===0?`<em class="tag vr">Phát sinh</em>`:`<em class="tag mx">Hỗn hợp</em>`; };
  // một dòng nhóm: nhóm 1 mục thì bấm vào xem chi tiết luôn; nhóm nhiều mục thì bấm để xổ các mục con
  const legRow = ([g,v]) => { const kids=gKids[g]||[], many=kids.length>1, open=S.homeOpenGroup===g;
      const head = `<button class="r" ${many?`data-group="${esc(g)}"`:`data-cattrend="${esc(kids[0][0])}"`}><i style="background:${colorOf(g)}"></i><span class="t">${esc(g)} ${tagOf(kids.map(k=>k[0]))}${many?` <span class="muted small">${kids.length} mục <span class="chev">${open?"▴":"▾"}</span></span>`:""}</span><b class="num small">${pct(v)}</b><span class="lv num">${fmt(v)} · TB ${shortMoney(v/months_with)}/tháng</span></button>`;
      return head + (many&&open ? `<div class="leg kids">${kids.map(([id,kv])=>{ const c=catById(id); return `<button class="r" data-cattrend="${esc(id)}"><i style="background:${colorOf(g)};opacity:.55"></i><span class="t">${esc(c?.parent?c.name:c?.name+" (chung)")}</span><b class="num small">${fmt(kv)}</b><span class="lv num">${(kv/v*100).toFixed(0)}% của nhóm · TB ${shortMoney(kv/months_with)}/tháng</span></button>`; }).join("")}</div>` : ""); };
  const rest=granked.slice(6), open=!!S.homeMoreCats;
  const legendCat = granked.slice(0,6).map(legRow).join("")
    + (rest.length ? `<button class="r more" id="moreCats"><i style="background:${CHART_REST}"></i><span class="t">${open?"Thu gọn":`${rest.length} nhóm khác`} <span class="chev">${open?"▴":"▾"}</span></span><b class="num small">${pct(rest.reduce((s,r)=>s+r[1],0))}</b></button>
      ${open?`<div class="leg morelist">${rest.map(legRow).join("")}</div>`:""}` : "");
  const fixCats=ranked.filter(([id])=>isFixedCat(catById(id)));

  return `<section class="card">
    <div class="row between"><h2>Chi tiêu ${N} tháng</h2><span class="small muted num">TB ${shortMoney(grand/months_with)}/tháng</span></div>
    <div class="seg plain" style="grid-template-columns:1fr 1fr"><button data-hm="cat" aria-pressed="${mode==="cat"}">Theo hạng mục</button><button data-hm="fix" aria-pressed="${mode==="fix"}">Cố định / Phát sinh</button></div>
    <div class="trend">${bars}</div>
    ${mode==="cat" ? `<div class="leg">${legendCat}</div>` : legendFix}
  </section>`;
}

/* vuốt một khoản sang trái quá ngưỡng → xoá luôn (có nút Hoàn tác trong thông báo); vuốt ngắn thì trả về */
const SWIPE_DEL=110;
function closeSwipes(){}
function enableSwipe(row, onDelete=swipeDelete, label="Xoá"){
  if (S.canWrite===false) return;
  let wrap=row.parentElement;
  if (!wrap.classList.contains("swipe")){
    wrap=document.createElement("div"); wrap.className="swipe "+(row.classList.contains("tx")?"txw":"cw"); row.before(wrap);
    const bg=document.createElement("div"); bg.className="sdel"; bg.setAttribute("aria-hidden","true"); bg.textContent=label;
    wrap.append(bg, row);
  }
  let x0=0, y0=0, dx=0, mode=null;
  row.onpointerdown=e=>{ if(e.button>0) return; x0=e.clientX; y0=e.clientY; dx=0; mode="maybe"; };
  row.onpointermove=e=>{ if(!mode) return; const mx=e.clientX-x0, my=e.clientY-y0;
    if (mode==="maybe"){ if(Math.abs(my)>10 && Math.abs(my)>Math.abs(mx)){ mode=null; return; } if(Math.abs(mx)<10) return; mode="drag"; row.classList.add("dragging"); try{ row.setPointerCapture(e.pointerId); }catch(_){} }
    dx=Math.min(0,mx); row.style.transform=`translateX(${dx}px)`; wrap.classList.toggle("armed", dx< -SWIPE_DEL); };
  const end=()=>{ if(mode==="drag"){ row.classList.remove("dragging"); row.dataset.swiped="1"; setTimeout(()=>delete row.dataset.swiped,350);
      if (dx < -SWIPE_DEL) onDelete(row, wrap); else { row.style.transform=""; wrap.classList.remove("armed"); } }
    mode=null; };
  row.onpointerup=end; row.onpointercancel=end;
}
/* vuốt một dòng hạng mục ở Báo cáo → xoá mọi khoản của hạng mục đó trong tháng đang xem */

const dateAdd = (s,k) => { const [y,m,d]=s.split("-").map(Number); const x=new Date(y,m-1,d+k); return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate()); };
const shortAmt = n => n>=1e6 ? (n/1e6).toFixed(n%1e6?1:0).replace(".",",")+"tr" : n>=1000 ? Math.round(n/1000)+"k" : fmt(n);
// khoản hay lặp lại (cùng hạng mục + ghi chú + số tiền, ≥ 2 lần trong 4 tháng) → chạm một lần là điền sẵn cả form
function quickTemplates(kind){
  const since=dateAdd(todayStr(),-120), m=new Map();
  S.txs.forEach(t=>{ if(t.kind!==kind||!t.categoryId||!catById(t.categoryId)||t.date<since) return;
    const key=t.categoryId+"|"+strip(t.note||"")+"|"+t.amount, o=m.get(key)||{t,n:0}; o.n++; if(t.date>=o.t.date) o.t=t; m.set(key,o); });
  return [...m.values()].filter(o=>o.n>=2).sort((a,b)=>b.n-a.n||b.t.date.localeCompare(a.t.date)).slice(0,8).map(o=>o.t);
}
// hạng mục dùng nhiều nhất 3 tháng gần đây
function frequentCats(kind, n=8){
  const since=dateAdd(todayStr(),-90), cnt={};
  S.txs.forEach(t=>{ if(t.kind===kind&&t.categoryId&&t.date>=since&&catById(t.categoryId)) cnt[t.categoryId]=(cnt[t.categoryId]||0)+1; });
  return Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([id])=>catById(id));
}
// gợi ý ghi chú cũ khớp chữ đang gõ (không phân biệt dấu), kèm hạng mục lần gần nhất dùng ghi chú đó
function noteSuggestions(kind, q){
  const w=strip(q).split(/\s+/).filter(Boolean); if(!w.length) return [];
  const m=new Map();
  S.txs.forEach(t=>{ const note=(t.note||"").trim(); if(t.kind!==kind||!note) return; const k=strip(note); if(!w.every(x=>k.includes(x))) return;
    const o=m.get(k)||{note,n:0,t}; o.n++; if(t.date>=o.t.date) o.t=t; m.set(k,o); });
  return [...m.values()].filter(o=>strip(o.note)!==strip(q)).sort((a,b)=>b.n-a.n).slice(0,5);
}

async function saveForm(){
  const f=S.form, err=$("#fErr"); err.textContent="";
  const amount = Number(f.amount)||0;
  if (amount<=0) { err.textContent="Nhập số tiền lớn hơn 0."; $("#fAmount").focus(); return; }
  if (amount>100000000000) { err.textContent="Số tiền quá lớn, kiểm tra lại số chữ số."; return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(f.date||"")) { err.textContent="Chọn ngày hợp lệ."; return; }
  if (!walletById(f.walletId)) { err.textContent="Chọn ví."; return; }
  if (f.kind==="transfer"){ if(!walletById(f.toWalletId)){err.textContent="Chọn ví nhận.";return;} if(f.toWalletId===f.walletId){err.textContent="Ví chuyển và ví nhận phải khác nhau.";return;} }
  else if (!catById(f.categoryId)) { err.textContent="Chọn một hạng mục."; window.scrollTo({top:200,behavior:"smooth"}); return; }
  const body = { kind:f.kind, amount, walletId:f.walletId, date:f.date, note:(f.note||"").trim(), categoryId: f.kind==="transfer"?"":f.categoryId, toWalletId: f.kind==="transfer"?f.toWalletId:"" };
  const btn=$("#fSave"), fab=$("#fSaveFab"); btn.disabled=true; btn.textContent="Đang lưu…"; if(fab) fab.disabled=true;
  try{
    if (S.editId){ const old=S.txs.find(t=>t.id===S.editId)||{}; await S.db.doc("tx/"+S.editId).set({...strip0(old), ...body, updatedAt:Date.now(), updatedBy:S.uid||""}); toast("Đã lưu thay đổi"); S.editId=null; S.form=null; setTab("book"); }
    else { await S.db.collection("tx").add({...body, by:S.uid||"", createdAt:Date.now()}); toast(`Đã ghi ${f.kind==="income"?"+":f.kind==="expense"?"−":""}${fmt(amount)} đ`); const k=f.kind, w=f.walletId; S.form=blankForm(); S.form.kind=k; S.form.walletId=w; S.month=ymOf(body.date); formView(); window.scrollTo(0,0); }
  }catch(e){ handleWriteErr(e); btn.disabled=false; btn.textContent=S.editId?"Lưu thay đổi":"Lưu ghi chép"; if(fab) fab.disabled=false; }
}

/* ---------- Báo cáo ---------- */
/* người nhận / người chuyển: phần đầu ghi chú "Đối tác · nội dung" (sao kê ngân hàng); quẹt thẻ thì lấy tên cửa hàng */
const partyNone = kind => kind==="income" ? "Không rõ người chuyển" : "Không rõ người nhận";
function partyOf(t){
  const note=String(t.note||"").trim(), seg=note.split(" · ");
  if (seg.length>=2) return (seg[0]==="Thẻ Visa"||seg[0]==="Hoàn tiền thẻ") ? seg[1].trim() : seg[0].trim();
  // khoản từ sao kê chỉ có tên đối tác, không có nội dung: "Nguyen Thi Ngan", "Wincommerce", "Fpt Pharma"
  if (String(t.id).startsWith("tcb-") && /^[A-Z0-9][A-Za-z0-9&.\-]*( [A-Z0-9][A-Za-z0-9&.\-]*){0,6}$/.test(note)) return note;
  return "";
}
function byParty(ym, kind){
  const m={}; S.txs.forEach(t=>{ if(t.kind!==kind || ymOf(t.date)!==ym || !isRealFlow(t)) return; const k=partyOf(t); const e=m[k]||(m[k]=[k,0,0]); e[1]+=+t.amount; e[2]++; });
  return Object.values(m).sort((a,b)=>b[1]-a[1]);
}
const initials = name => { const w=String(name||"?").trim().split(/\s+/).filter(Boolean); return ((w[0]||"?")[0]+(w.length>1?w[w.length-1][0]:"")).toUpperCase(); };
function partyDetailView(){
  const kind=S.repKind||"expense", party=S.repParty==="\u0000"?"":S.repParty;
  const list=sortTx(S.txs.filter(t=>t.kind===kind && ymOf(t.date)===S.month && isRealFlow(t) && partyOf(t)===party));
  const sum=list.reduce((s,t)=>s+(+t.amount),0); const {inc,exp}=monthTotals(S.month); const all=kind==="income"?inc:exp;
  const groups={}; list.forEach(t=>(groups[t.date]=groups[t.date]||[]).push(t));
  const cats={}; list.forEach(t=>{ const n=catById(t.categoryId)?.name||"Không rõ"; cats[n]=(cats[n]||0)+(+t.amount); });
  $("#view").innerHTML = `<div class="listhead"><button class="chip" id="back">‹ Sổ</button></div>${monthBar()}
  <section class="balance"><div class="row"><span class="ico lg av" style="--c:${rankColor(0)}">${esc(initials(party||"?"))}</span><div style="min-width:0"><div class="label">${esc(party||partyNone(kind))}</div><div class="big num ${kind==="income"?"in-c":"out-c"}">${money(sum)}</div></div></div>

    ${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<div><span>· ${esc(n)}</span><b class="num">${fmt(v)}</b></div>`).join("")}</div></section>
  ${list.length ? Object.keys(groups).map(d=>{ const g=groups[d]; const tot=g.reduce((s,t)=>s+(+t.amount),0);
    return `<section class="card" style="gap:4px"><div class="dayhead"><span class="d"><b>${d.slice(8)}</b><span>${weekday(d)}<br>${monthLabel(d.slice(0,7))}</span></span><span class="num ${kind==="income"?"in-c":"out-c"}">${kind==="income"?"+":"−"}${fmt(tot)}</span></div><div class="list-plain">${g.map(txRow).join("")}</div></section>`; }).join("")
    : `<div class="card">${emptyTx("Tháng này không có khoản nào","Chuyển sang tháng khác bằng nút ‹ ›.")}</div>`}`;
  $("#back").onclick=()=>{ S.repParty=null; render(); window.scrollTo(0,0); };
  bindMonthBar(); bindTxRows();

function reportView(){

  </div>`;
  $("#view").innerHTML = `${monthBar()}

function shortMoney(v){ if(v>=1e9) return (v/1e9).toLocaleString("vi-VN",{maximumFractionDigits:1})+" tỷ"; if(v>=1e6) return (v/1e6).toLocaleString("vi-VN",{maximumFractionDigits:1})+" tr"; if(v>=1e3) return (v/1e3).toLocaleString("vi-VN",{maximumFractionDigits:0})+"k"; return String(Math.round(v)); }

function picker(sel){ return `<div class="picker">${ICON_KEYS.map(k=>`<button data-pick="${k}" aria-pressed="${k===sel}" aria-label="${k}">${icoHTML(k)}</button>`).join("")}</div>`; }
function catsView(){
  const k = S.catKind||"expense";
  const cs=S.cats.filter(c=>c.kind===k).sort((a,b)=>(a.order||0)-(b.order||0));
  const cnt={}; S.txs.forEach(t=>{ if(t.categoryId) cnt[t.categoryId]=(cnt[t.categoryId]||0)+1; });
  const unused=cs.filter(c=>!cnt[c.id]);
  // gợi ý gộp: tên giống nhau sau khi bỏ dấu, dấu câu và chữ "tiền", hoặc tên này nằm trong tên kia
  const norm=c=>strip(c.name).replace(/\btien\b/g,"").replace(/[^a-z0-9]/g,"");
  const usedC=cs.filter(c=>cnt[c.id]); const best={};
  const clash=(x,y)=>/dienthoai/.test(x)!==/dienthoai/.test(y);   // "điện" khác "điện thoại"
  for (let i=0;i<usedC.length;i++) for (let j=i+1;j<usedC.length;j++){ const a=usedC[i], b=usedC[j]; const x=norm(a), y=norm(b);
    if (x.length<4||y.length<4||clash(x,y)) continue;
    if (x===y || x.includes(y) || y.includes(x)){ const [small,big]=(cnt[a.id]||0)<=(cnt[b.id]||0)?[a,b]:[b,a];
      if (!best[small.id] || (cnt[big.id]||0)>(cnt[best[small.id].id]||0)) best[small.id]=big; } }
  // không gợi ý gộp A→B khi B lại đang được gợi ý gộp đi chỗ khác
  const sugg=Object.entries(best).filter(([sid,b])=>!best[b.id]).map(([sid,b])=>[catById(sid),b]).sort((p,q)=>(cnt[q[0].id]||0)-(cnt[p[0].id]||0));
  const newKey = S.newIcon || "other";
  // nhóm theo hạng mục cha (giống Tổng quan): "Ăn uống" gồm Ăn uống + Đi chợ + Ăn sáng…; nhóm 1 mục thì hiện thẳng
  const groupOf=c=>(c.parent||c.name||"").trim(), gmap=new Map();
  cs.forEach(c=>{ const g=groupOf(c); if(!gmap.has(g)) gmap.set(g,[]); gmap.get(g).push(c); });
  const groups=[...gmap.entries()].map(([g,l])=>[g,l.sort((a,b)=>(!!a.parent)-(!!b.parent)||(a.order||0)-(b.order||0))]);
  const catRow=(c,inGroup)=>{ const n=cnt[c.id]||0;
      return `<div><div class="catedit" data-drop="${inGroup||c.parent?"g:"+esc(groupOf(c)):"c:"+esc(c.id)}"><span class="grip" data-drag="${esc(c.id)}" title="Giữ để kéo sang nhóm khác" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg></span><button class="ib" data-pickfor="${esc(c.id)}" aria-label="Đổi icon">${icoHTML(catIconKey(c))}</button><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">${inGroup?(c.parent?"":`<span class="small muted">Mục chung</span>`):c.parent?`<span class="small muted">${esc(c.parent)} ›</span>`:""}<input class="input" data-rename="${esc(c.id)}" value="${esc(c.name)}" maxlength="40" aria-label="Tên hạng mục"></div><span class="small muted num" style="flex:none;min-width:38px;text-align:right">${n} khoản</span>${n?`<button class="chip" data-mergecat="${esc(c.id)}">Gộp</button>`:`<button class="chip" data-del="${esc(c.id)}">Xoá</button>`}</div>${S.pickFor===c.id?picker(catIconKey(c)):""}${S.mergeCat===c.id?`<div class="mergebox"><span class="small">Gộp ${n} khoản của “${esc(c.name)}” vào</span><div class="grid2"><select class="input" id="mcTo">${cs.filter(x=>x.id!==c.id).sort((a,b)=>(cnt[b.id]||0)-(cnt[a.id]||0)).map(x=>`<option value="${esc(x.id)}">${esc(x.parent?x.parent+" › "+x.name:x.name)} (${cnt[x.id]||0})</option>`).join("")}</select><button class="btn ghost" id="mcGo">Gộp</button></div></div>`:""}</div>`; };
  $("#view").innerHTML = `${backBtn()}
  <section class="card">
    <h2>Hạng mục</h2>
    <div class="seg plain" style="grid-template-columns:1fr 1fr"><button data-k="expense" aria-pressed="${k==="expense"}">Chi tiền</button><button data-k="income" aria-pressed="${k==="income"}">Thu tiền</button></div>
    <p class="small muted" style="margin:0">Chạm vào icon để đổi hình, sửa tên ngay trong ô. Giữ nút ⠿ rồi kéo hạng mục thả vào nhóm khác (hoặc thả lên một hạng mục để gom thành nhóm).</p>
    <div class="dropout" data-drop="out" hidden>Thả vào đây để tách khỏi nhóm</div>
    ${unused.length?`<button class="btn ghost" id="cPurge">Xoá ${unused.length} hạng mục chưa dùng</button>`:""}
    <div class="list-plain">${groups.map(([g,kids])=>{ if(kids.length===1) return catRow(kids[0],false);
      const open=!!S.catOpen?.[g]||kids.some(c=>c.id===S.pickFor||c.id===S.mergeCat), tot=kids.reduce((s,c)=>s+(cnt[c.id]||0),0), main=kids.find(c=>!c.parent&&c.name===g), gIco=main?catIconKey(main):guessIcon(g)!=="other"?guessIcon(g):catIconKey(kids[0]);
      // dòng nhóm sửa được: chạm icon để đổi icon nhóm, sửa tên nhóm ngay trong ô (các mục con đổi theo)
      return `<div><div class="cgroup" data-drop="g:${esc(g)}" aria-expanded="${open}"><button class="ib" data-pickfor="g:${esc(main?.id||"")}" data-gname="${esc(g)}" aria-label="Đổi icon nhóm">${icoHTML(gIco)}</button><span class="t"><input class="input ginput" data-grename="${esc(g)}" value="${esc(g)}" maxlength="40" aria-label="Tên nhóm"><span class="small muted" data-cgroup="${esc(g)}">${kids.length} mục · ${tot} khoản</span></span><button class="chev" data-cgroup="${esc(g)}" aria-label="${open?"Thu gọn":"Mở"} nhóm"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div>${S.pickFor==="g:"+(main?.id||"")&&S.pickGroup===g?picker(gIco):""}${open?`<div class="ckids">${kids.map(c=>catRow(c,true)).join("")}</div>`:""}</div>`; }).join("")}</div>
  </section>
  ${sugg.length?`<section class="card"><h2>Gợi ý gộp hạng mục trùng</h2><p class="small muted" style="margin:0">Các cặp tên gần giống nhau. Gộp hạng mục ít khoản vào hạng mục nhiều khoản; các khoản được chuyển sang, hạng mục cũ bị xoá.</p>
    <div class="list-plain">${sugg.map(([a,b])=>`<div class="menuitem" style="padding:8px 0"><div class="mid"><div style="font-weight:600">${esc(a.name)} <span class="muted small">(${cnt[a.id]||0})</span> → ${esc(b.parent?b.parent+" › "+b.name:b.name)} <span class="muted small">(${cnt[b.id]||0})</span></div></div><button class="chip" data-sugg="${esc(a.id)}|${esc(b.id)}">Gộp</button></div>`).join("")}</div></section>`:""}
  <section class="card"><h2>Thêm hạng mục</h2>
    <div class="catedit"><button class="ib" data-pickfor="__new" aria-label="Chọn icon">${icoHTML(newKey)}</button><input class="input" id="cNew" maxlength="40" placeholder="Ví dụ: Tiền học thêm"><button class="btn" id="cAdd" style="flex:none;min-height:44px">Thêm</button></div>
    ${S.pickFor==="__new"?picker(newKey):""}
    <div class="err" id="cErr" role="alert"></div>
  </section>`;
  bindBack();
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{S.catKind=b.dataset.k; S.pickFor=null; catsView();});

/* đổi tên nhóm: mục chung (nếu có) đổi tên, mọi mục con đổi "nhóm cha" theo */
async function renameGroup(kind, oldName, n, inp){
  if (!n || n===oldName){ if(inp) inp.value=oldName; return; }
  const main=S.cats.find(c=>c.kind===kind&&!c.parent&&c.name===oldName), kids=S.cats.filter(c=>c.kind===kind&&c.parent===oldName);
  if (S.cats.some(c=>c.kind===kind&&c!==main&&!kids.includes(c)&&(strip(c.name)===strip(n)||strip(c.parent||"")===strip(n)))){ toast(`Đã có hạng mục / nhóm tên “${n}”`); if(inp) inp.value=oldName; return; }
  try{
    if (main) await S.db.doc("categories/"+main.id).set({...strip0(main),name:n,icon:catIconKey(main)});
    for (const c of kids) await S.db.doc("categories/"+c.id).set({...strip0(c),parent:n,icon:catIconKey(c)});
    if (S.catOpen?.[oldName]) S.catOpen={...S.catOpen,[n]:true};
    toast(`Đã đổi tên nhóm thành “${n}”`);
  }catch(e){ handleWriteErr(e); }
  catsView();
}
/* kéo thả hạng mục giữa các nhóm: giữ nút ⠿ rồi kéo; thả lên dòng nhóm / mục trong nhóm → vào nhóm đó,
   thả lên một hạng mục đứng riêng → gom thành nhóm mang tên mục đó, thả vào ô "tách khỏi nhóm" → đứng riêng */
function bindCatDrag(){
  document.querySelectorAll("[data-drag]").forEach(h=>h.onpointerdown=e=>{
    if (e.button>0 || S.canWrite===false) return;
    e.preventDefault();
    const c=catById(h.dataset.drag); if(!c) return;
    const row=h.closest(".catedit"), r=row.getBoundingClientRect();
    const ghost=row.cloneNode(true); ghost.classList.add("dragghost"); ghost.style.width=r.width+"px"; document.body.appendChild(ghost);
    const dx=e.clientX-r.left, dy=e.clientY-r.top;
    row.classList.add("dragging");
    const out=$(".dropout"); if(out) out.hidden=!c.parent;
    let target=null, lastY=e.clientY, raf=0;
    const place=(x,y)=>{ ghost.style.transform=`translate(${x-dx}px,${y-dy}px)`; };
    place(e.clientX,e.clientY);
    const pick=(x,y)=>{ const el=document.elementFromPoint(x,y)?.closest("[data-drop]");
      const t = el && el!==row ? el : null;
      if (t!==target){ target?.classList.remove("dropon"); target=t; target?.classList.add("dropon"); } };
    // tự cuộn khi kéo sát mép trên / dưới màn hình
    const scroll=()=>{ const H=innerHeight, edge=90; const v = lastY<edge ? -(edge-lastY)/6 : lastY>H-edge-70 ? (lastY-(H-edge-70))/6 : 0;
      if (v){ window.scrollBy(0,v); } raf=requestAnimationFrame(scroll); };
    raf=requestAnimationFrame(scroll);
    const move=ev=>{ lastY=ev.clientY; place(ev.clientX,ev.clientY); pick(ev.clientX,ev.clientY); };
    const end=async ev=>{
      removeEventListener("pointermove",move); removeEventListener("pointerup",end); removeEventListener("pointercancel",end);
      cancelAnimationFrame(raf); ghost.remove(); row.classList.remove("dragging"); target?.classList.remove("dropon"); if(out) out.hidden=true;
      if (ev.type!=="pointerup" || !target) return;
      const d=target.dataset.drop; let parent;
      if (d==="out") parent="";
      else if (d.startsWith("g:")) parent=d.slice(2);
      else { const t=catById(d.slice(2)); if(!t) return; parent=t.name; }
      if (parent===c.name) parent="";                         // thả về nhóm mang tên chính nó = mục chung của nhóm đó
      if ((c.parent||"")===parent) return;
      if (S.cats.some(x=>x.kind===c.kind && x.id!==c.id && x.parent===c.name)){ toast(`“${c.name}” đang là nhóm có hạng mục con, chuyển các mục con đi trước`); return; }
      try{ await S.db.doc("categories/"+c.id).set({...strip0(c),parent,icon:catIconKey(c)}); S.catOpen={...S.catOpen,[parent||c.name]:true};
        toast(parent?`Đã chuyển “${c.name}” vào nhóm ${parent}`:`Đã tách “${c.name}” khỏi nhóm`); }catch(err){ handleWriteErr(err); }
      catsView(); };
    addEventListener("pointermove",move); addEventListener("pointerup",end); addEventListener("pointercancel",end);
  });
}
/* gộp hạng mục: chuyển mọi khoản sang hạng mục đích rồi xoá hạng mục cũ */
async function mergeCategory(src, dst){
  const n=S.txs.filter(t=>t.categoryId===src.id).length;
  const {error}=await S.sb.from("tx").update({category_id:dst.id,updated_by:S.uid||null,updated_at:new Date().toISOString()}).eq("household_id",S.hid).eq("category_id",src.id);
  if (error){ toast("Chưa gộp được: "+error.message); catsView(); return; }
  try{ await S.db.doc("categories/"+src.id).delete(); }catch(e){}
  await S.db.reload(); S.mergeCat=null; toast(`Đã gộp ${n} khoản “${src.name}” vào “${dst.name}”`); catsView();
}

const HINTS={

function hintHit(h,k){ return k.length<=3 ? new RegExp("(^|[^a-z])"+k.replace(/[/]/g,"\\/")+"([^a-z]|$)").test(h) : h.includes(k); }
function guessMap(headers){
  const m={}; const used=new Set();
  const hs=headers.map(x=>strip(x).replace(/\s+/g," "));
  for(const f of ["balance","ref","inAmt","outAmt","date","amount","kind","category","note","wallet"]){
    for(const k of HINTS[f]){ const i=hs.findIndex((h,ix)=>h && !used.has(ix) && hintHit(h,k)); if(i>=0){ m[f]=i; used.add(i); break; } }
  }
  if (m.wallet!=null && /so tai khoan|account no|account number/.test(hs[m.wallet])) delete m.wallet; // cột số TK không phải tên ví
  delete m.balance;
  return m;
}

/* ---------- "Bảng kê thu chi" của app Sổ Thu Chi: mỗi trang tính là một ví ----------
   Dòng tiêu đề: STT | Ngày | Giờ | Số tiền thu | Số tiền chi | Số dư | Hạng mục cha | Hạng mục con | Chi cho ai | Chuyến đi/Sự kiện | Diễn giải

const TRANSFER_RE=/\s*\((Chuyển tới|Chuyển từ)\s+(.+?)\)\s*$/i;
function stcParse(aoa){
  const hi=aoa.findIndex(r=>strip(r[0])==="stt" && r.some(c=>strip(c)==="hang muc cha"));
  if (hi<0) return null;
  const h=aoa[hi].map(c=>strip(c)); const col=n=>h.indexOf(n);
  const c={date:col("ngay"),time:col("gio"),inA:col("so tien thu"),outA:col("so tien chi"),parent:col("hang muc cha"),child:col("hang muc con"),who:col("chi cho ai"),event:col("chuyen di/su kien"),note:col("dien giai")};
  let open=0, close=null;
  for (const r of aoa.slice(0,hi)) for (let k=0;k<r.length-1;k++){ const s=strip(r[k]);
    if (/^so du dau k[iy]$/.test(s)) open=toNum(r[k+1]); if (/^so du cuoi k[iy]$/.test(s)) close=toNum(r[k+1]); }
  const txt=(r,i)=> i<0 ? "" : String(r[i]??"").replace(/\s+/g," ").trim();
  const rows=[];
  for (const r of aoa.slice(hi+1)){

    if (!cat && lk.length>2 && learn[kind+"|"+lk]){ cat=catById(learn[kind+"|"+lk]); if(cat) learned++; }
    if (!cat) for (const [re,k,tg] of TCB_RULES){ if (k && k!==kind) continue; if (!re.test(text)) continue;
      if (tg.internal){ cat=findOrNew(kind,"Chuyển giữa tài khoản","transfer"); internal++; }
      else if (tg.debt){ const [dk,dn]=DEBT_NAME[tg.debt]; if(dk!==kind) continue; cat=S.cats.find(c=>c.kind===kind&&debtKind(c)===tg.debt)||findOrNew(kind,dn,"handshake"); }
      else if (tg.name) cat=findOrNew(kind,tg.name,tg.icon);
      else { cat=findCatByKey(tg.key,kind); if(!cat){ const def=(DEFAULT_CATS[kind]||[]).find(x=>x[1]===tg.key); if(def) cat=findOrNew(kind,def[0],def[1]); } }
      if (cat){ if(!tg.internal) guessed++; break; } }
    if (!cat) cat=S.cats.find(c=>c.kind===kind&&strip(c.name)==="khac")||findOrNew(kind,"Khác","other");
    const id="tcb-"+hashStr([S.hid,r.ref,r.date,kind,amount].join("|"));
    let uid=id, k=1; while(seen.has(uid)) uid=id+"-"+(++k); seen.add(uid);
    if (have.has(uid)){ dupes++; return; }
    const [y,mo,dd]=r.date.split("-").map(Number);
    items.push({id:uid,kind,amount,cat,note,ref:r.ref.slice(0,60),date:r.date,createdAt:new Date(y,mo-1,dd,12,0).getTime()+i});
    if (!isInternalCat(cat) && !debtKind(cat)){ if(kind==="income") sumIn+=amount; else sumOut+=amount; }
    if(!from||r.date<from) from=r.date; if(!to||r.date>to) to=r.date;
  });
  return {items,newCats,dupes,sumIn,sumOut,guessed,learned,internal,from,to};
}

function readFile(file){
  const err=$("#iErr"); if(!file) return;
  if (/\.pdf$/i.test(file.name)){ err.textContent="Sổ chưa đọc được sao kê PDF. Hãy xuất sao kê dạng Excel (.xlsx) rồi chọn lại."; return; }
  if (typeof XLSX==="undefined"){ err.textContent="Chưa tải được thư viện đọc Excel. Kiểm tra mạng rồi mở lại trang."; return; }
  if (file.size>15*1024*1024){ err.textContent="File lớn hơn 15 MB, hãy xuất sao kê theo từng tháng."; return; }
  const r=new FileReader();
  r.onload=()=>{ try{
      const wb=XLSX.read(new Uint8Array(r.result),{type:"array",cellDates:true});
      const st={wb,fileName:file.name,sheetNames:wb.SheetNames};
      const stc=wb.SheetNames.map(name=>({name,...(stcParse(XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:""}))||{})})).filter(s=>s.rows);
      if (stc.length){ st.stc=stc; S.importState=st; importView(); return; }
      for (const name of wb.SheetNames){ const t=tcbParse(XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:""})); if(t){ st.tcb=t; S.importState=st; importView(); return; } }
      loadSheet(st, wb.SheetNames[0]);
      const head = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""}).slice(0,st.headRow+1).flat().join(" ");
      st.isTcb = /techcom|tcb/i.test(strip(head)+" "+strip(file.name));
      const tcbW = S.wallets.find(w=>strip(w.name).includes("techcom"));
      st.defWallet = tcbW ? tcbW.id : (st.isTcb ? "__tcb" : (S.wallets.find(w=>w.type==="bank")||S.wallets[0])?.id);
      S.importState=st; importView();
    }catch(e){ err.textContent="Không đọc được file này. Hãy mở bằng Excel, lưu lại dạng .xlsx rồi thử lại."; } };
  r.onerror=()=>err.textContent="Không mở được file.";
  r.readAsArrayBuffer(file);
}
function loadSheet(st, name, headRow){
  const aoa=XLSX.utils.sheet_to_json(st.wb.Sheets[name],{header:1,raw:true,defval:""});
  if (headRow==null){ let best=0,score=-1; for(let i=0;i<Math.min(40,aoa.length);i++){ const s=Object.keys(guessMap(aoa[i].map(String))).length; if(s>score){score=s;best=i} } headRow=best; }
  st.sheet=name; st.headRow=headRow;
  let headers=(aoa[headRow]||[]).map(h=>String(h).trim());
  /* tiêu đề song ngữ hai dòng (Ngày giao dịch / Transaction date): gộp dòng kế nếu dòng đó cũng toàn chữ */
  const nxt=aoa[headRow+1]||[]; let skip=0;
  if (nxt.length && nxt.every(c=>c===""||(typeof c==="string" && !/\d/.test(c))) && nxt.some(c=>c!=="")){ headers=headers.map((h,i)=>(h+" "+String(nxt[i]||"")).trim()); skip=1; }
  st.headers=headers; st.rows=aoa.slice(headRow+1+skip); st.map=guessMap(headers);
}
function toISO(v){
  if (v instanceof Date && !isNaN(v)) return v.getFullYear()+"-"+pad(v.getMonth()+1)+"-"+pad(v.getDate());
  if (typeof v==="number" && v>20000 && v<80000){ const d=XLSX.SSF.parse_date_code(v); if(d) return d.y+"-"+pad(d.m)+"-"+pad(d.d); }
  const s=String(v||"").trim(); let m;
  if ((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))){ let y=+m[3]; if(y<100) y+=2000; const d=+m[1], mo=+m[2]; if(mo>=1&&mo<=12&&d>=1&&d<=31) return y+"-"+pad(mo)+"-"+pad(d); }
  if ((m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/))) return m[1]+"-"+pad(+m[2])+"-"+pad(+m[3]);
  return null;
}
function toNum(v){
  if(typeof v==="number") return v;
  let s=String(v||"").trim(); if(!s||s==="-") return 0;
  const neg=/^-|^\(.*\)$/.test(s);
  s=s.replace(/[^\d.,]/g,"");
  if (/[.,]\d{1,2}$/.test(s) && /[.,]/.test(s.replace(/[.,]\d{1,2}$/,""))) s=s.replace(/[.,]\d{1,2}$/,""); // 1,000,000.00 → bỏ phần lẻ
  else if (/^\d+[.,]\d{1,2}$/.test(s)) s=s.replace(/[.,]\d{1,2}$/,"");
  const n=Number(s.replace(/[^\d]/g,""));
  return (neg?-1:1)*(n||0);
}
function buildImport(){

  const findCat=(name,kind)=>{ const key=strip(name); return S.cats.find(c=>c.kind===kind&&strip(c.name)===key) || newCats.find(c=>c.kind===kind&&strip(c.name)===key); };
  const g=(row,f)=> m[f]==null ? "" : row[m[f]];
  const tcbNew = st.defWallet==="__tcb";
  if (tcbNew) newWallets.push("Techcombank");
  for (const row of st.rows){
    if (!row || row.every(c=>String(c).trim()==="")) continue;
    const date=toISO(g(row,"date")); let kind=null, amount=0; const kv=strip(g(row,"kind"));
    if (m.inAmt!=null || m.outAmt!=null){ const a=Math.abs(toNum(g(row,"inAmt"))), b=Math.abs(toNum(g(row,"outAmt"))); if(a>0){kind="income";amount=a} else if(b>0){kind="expense";amount=b} }
    if (!kind && m.amount!=null){ const n=toNum(g(row,"amount")); amount=Math.abs(n);
      if (kv.includes("chuyen")) { transfers++; skipped++; continue; }
      kind = (kv.startsWith("thu")||kv.includes("thu tien")||kv==="income"||(!kv && n>0 && m.kind==null && false)) ? "income" : "expense"; }
    if (!date || !amount || !kind){ skipped++; continue; }
    const note=String(g(row,"note")||"").replace(/\s+/g," ").trim();
    const ref=String(g(row,"ref")||"").trim();
    const id="imp-"+hashStr([S.hid,date,kind,amount,ref,strip(note)].join("|"));
    if (have.has(id)){ dupes++; continue; }
    let uid=id, k=1; while(seen.has(uid)) uid=id+"-"+(++k); seen.add(uid); // 2 giao dịch giống hệt trong cùng file vẫn giữ cả hai
    let cat=null; const catName=String(g(row,"category")||"").trim();
    if (catName){ cat=findCat(catName,kind); if(!cat){ cat={name:catName,kind,icon:guessIcon(catName),_new:true}; newCats.push(cat); } }
    else { const key=guessCatKey(note,kind); if(key){ cat=findCatByKey(key,kind); if(cat) guessed++; }
      if(!cat){ cat=findCat("Khác",kind); if(!cat){ cat={name:"Khác",kind,icon:"other",_new:true}; newCats.push(cat); } } }
    const wName=String(g(row,"wallet")||"").trim(); let walletName, walletId=null;
    if (wName){ const w=S.wallets.find(x=>strip(x.name)===strip(wName)); if(w){walletId=w.id;walletName=w.name} else { walletName=wName; if(!newWallets.some(n=>strip(n)===strip(wName))) newWallets.push(wName); } }
    else if (tcbNew){ walletName="Techcombank"; }
    else { const w=walletById(st.defWallet); walletId=w?.id; walletName=w?.name||""; }
    items.push({id:uid,date,kind,amount,catName:cat.name,cat,walletName,walletId,note:note.slice(0,200),ref:ref.slice(0,60)});
    if(kind==="income") sumIn+=amount; else sumOut+=amount;
    if(!from||date<from) from=date; if(!to||date>to) to=date;
  }
  items.sort((a,b)=>a.date<b.date?1:-1);
  return {items,skipped,transfers,sumIn,sumOut,newCats,newWallets,dupes,guessed,from,to};
}
async function runImport(){
  const btn=$("#iGo"), err=$("#iErr"); const plan=buildImport(); if(!plan.items.length) return;
  btn.disabled=true; $("#iCancel").disabled=true;
  const batch="imp-"+Date.now(); const ids=[];
  try{
    const catIds={}, walIds={};
    let order=Math.max(0,...S.cats.map(c=>c.order||0));
    for (const c of plan.newCats){ const ref=await S.db.collection("categories").add({name:c.name,kind:c.kind,icon:c.icon,order:++order}); catIds[c.kind+"|"+strip(c.name)]=ref.id; }
    let wo=Math.max(0,...S.wallets.map(w=>w.order||0));
    for (const n of plan.newWallets){ const t=guessWallet(n); const ref=await S.db.collection("wallets").add({name:n,type:t,icon:t,initial:0,order:++wo,createdAt:Date.now()}); walIds[strip(n)]=ref.id; }
    const docs=plan.items.map(it=>({id:it.id,kind:it.kind,amount:it.amount,walletId:it.walletId||walIds[strip(it.walletName)],categoryId:it.cat._new?catIds[it.kind+"|"+strip(it.cat.name)]:it.cat.id,toWalletId:"",date:it.date,note:it.note,ref:it.ref,by:S.uid||"",src:batch}));
    docs.forEach(d=>ids.push(d.id));
    await S.db.bulkInsert("tx",docs,n=>{ btn.textContent=`Đang nhập ${n}/${docs.length}…`; });
    S.lastBatch={id:batch,ids}; S.importState=null; toast(`Đã nhập ${ids.length} giao dịch`); importView();
  }catch(e){ if(ids.length) S.lastBatch={id:batch,ids}; err.textContent = e?.code==="quota_exceeded" ? "Sổ đã đầy dung lượng, chỉ nhập được một phần." : "Nhập dừng giữa chừng. Bấm Thử lại: giao dịch đã nhập sẽ được bỏ qua."; btn.textContent="Thử lại"; btn.disabled=false; $("#iCancel").disabled=false; if(e?.code==="invalid_argument") handleWriteErr(e); }
}
function guessWallet(n){ const s=strip(n); if(/bank|ngan hang|vcb|vietcom|techcom|tcb|bidv|agri|\bmb\b|acb|vpb|tpb|sacom|vietin/.test(s)) return "bank"; if(/\bthe\b|card|visa|master/.test(s)) return "card"; if(/momo|zalo|shopee|vnpay|vi dien tu/.test(s)) return "ewallet"; if(/tiet kiem/.test(s)) return "saving"; return "cash"; }
async function undoBatch(){
  const b=S.lastBatch; if(!b) return; const btn=$("#undoBatch"); btn.disabled=true; btn.textContent="Đang hoàn tác…";
  try{ await S.db.deleteWhere("tx","src",b.id); S.lastBatch=null; toast("Đã hoàn tác lần nhập"); }catch(e){ handleWriteErr(e); btn.disabled=false; btn.textContent="Hoàn tác lần nhập này"; }
  importView();
}

/* ánh xạ cột DB ↔ trường trong app */
const MAP = {
  wallets:   {name:"name",type:"type",icon:"icon",initial:"initial",order:"sort"},
  categories:{name:"name",kind:"kind",icon:"icon",order:"sort",parent:"parent",fixed:"fixed"},
  tx:        {kind:"kind",amount:"amount",walletId:"wallet_id",toWalletId:"to_wallet_id",categoryId:"category_id",date:"date",note:"note",ref:"ref",src:"src",by:"created_by",updatedBy:"updated_by"}
};
const NULLABLE = new Set(["to_wallet_id","category_id","created_by","updated_by","icon","src","fixed"]);
function toRow(col, o){
  const r={}; for (const [k,c] of Object.entries(MAP[col])) if (o[k]!==undefined){ let v=o[k]; if (NULLABLE.has(c) && v==="") v=null; r[c]=v; }
  if (col==="tx"){ if (o.createdAt) r.created_at=new Date(o.createdAt).toISOString(); if (o.updatedAt) r.updated_at=new Date(o.updatedAt).toISOString(); }
  return r;
}
function fromRow(col, r){
  const o={id:r.id}; for (const [k,c] of Object.entries(MAP[col])) if (r[c]!==undefined) o[k] = r[c]==null ? "" : r[c];
  if (o.amount!==undefined) o.amount=Number(o.amount); if (o.initial!==undefined) o.initial=Number(o.initial);
  if (r.created_at) o.createdAt=Date.parse(r.created_at); if (r.updated_at) o.updatedAt=Date.parse(r.updated_at);
  return o;
}
function mapErr(e){
  const m=String(e?.message||""); const c=String(e?.code||"");
  if (c==="42501" || /row-level security|permission/i.test(m)) return {code:"invalid_argument",message:m};
  if (c==="23503") return {code:"in_use",message:m};
  if (c==="23514" || c==="22P02") return {code:"bad_data",message:m};
  return {code:"unavailable",message:m};
}

/* lớp dữ liệu: giữ bản sao trong bộ nhớ, ghi lên Supabase, nghe thay đổi realtime */
function makeDb(sb, hid){
  const store={wallets:new Map(),categories:new Map(),tx:new Map()};
  const listeners={wallets:[],categories:[],tx:[]};
  const emit=col=>{ const docs=[...store[col].values()].map(o=>({id:o.id,data:()=>{const c={...o};delete c.id;return c;}})); listeners[col].forEach(fn=>fn({docs})); };
  const docRef=(col,id)=>({ id,
    async set(data){ const row={...toRow(col,data), id, household_id:hid}; const {data:out,error}=await sb.from(col).upsert(row).select().single(); if(error) throw mapErr(error); store[col].set(id, fromRow(col,out)); emit(col); },
    async delete(){ const {error}=await sb.from(col).delete().eq("id",id).eq("household_id",hid); if(error) throw mapErr(error); store[col].delete(id); emit(col); }
  });
  async function loadAll(col){
    const out=[]; for(let from=0;;from+=1000){ const {data,error}=await sb.from(col).select("*").eq("household_id",hid).range(from,from+999); if(error) throw mapErr(error); out.push(...data); if(data.length<1000) break; }
    store[col]=new Map(out.map(r=>[r.id,fromRow(col,r)])); emit(col);
  }
  const api={
    doc:path=>{ const [col,id]=path.split("/"); return docRef(col,id); },
    collection:col=>({
      doc:id=>docRef(col,id||uuid()),
      async add(data){ const r=docRef(col,uuid()); await r.set(data); return r; },
      onSnapshot(next,err){ listeners[col].push(next); loadAll(col).catch(e=>err&&err(e)); return ()=>{ listeners[col]=listeners[col].filter(f=>f!==next); }; }
    }),
    async bulkInsert(col, docs, onProgress){
      let done=0; for(let i=0;i<docs.length;i+=300){ const chunk=docs.slice(i,i+300).map(d=>({...toRow(col,d), id:d.id, household_id:hid}));
        const {data,error}=await sb.from(col).upsert(chunk,{onConflict:"id",ignoreDuplicates:true}).select(); if(error) throw mapErr(error);
        (data||[]).forEach(r=>store[col].set(r.id,fromRow(col,r))); done+=chunk.length; onProgress&&onProgress(done); }
      emit(col);
    },
    async deleteIds(col, ids){
      for(let i=0;i<ids.length;i+=200){ const chunk=ids.slice(i,i+200); const {error}=await sb.from(col).delete().eq("household_id",hid).in("id",chunk); if(error) throw mapErr(error); chunk.forEach(id=>store[col].delete(id)); }
      emit(col);
    },
    async deleteWhere(col, field, value){ const {error}=await sb.from(col).delete().eq("household_id",hid).eq(field,value); if(error) throw mapErr(error); for(const [id,o] of store[col]) if(o[Object.keys(MAP[col]).find(k=>MAP[col][k]===field)]===value) store[col].delete(id); emit(col); },
    reload:()=>Promise.all(["wallets","categories","tx"].map(loadAll))
  };
  /* realtime: thay đổi từ người nhà khác */
  const ch=sb.channel("nha-"+hid);
  for (const col of ["wallets","categories","tx"]){
    ch.on("postgres_changes",{event:"*",schema:"public",table:col,filter:"household_id=eq."+hid},p=>{
      if (p.eventType==="DELETE"){ if(p.old?.id){ store[col].delete(p.old.id); emit(col);} }
      else if (p.new?.id){ store[col].set(p.new.id, fromRow(col,p.new)); emit(col); }
    });
  }
  ch.on("postgres_changes",{event:"*",schema:"public",table:"members",filter:"household_id=eq."+hid},()=>loadMembers());
  ch.subscribe(status=>{ if(status==="SUBSCRIBED" && api._subscribedOnce) api.reload().catch(()=>{}); if(status==="SUBSCRIBED") api._subscribedOnce=true; });
  document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") api.reload().catch(()=>{}); });
  return api;
}

  if(error||!h){ lsSet("snm_hid",null); return chooseHousehold(); }
  S.hid=hid; S.household=h; lsSet("snm_hid",hid); S.canWrite=true;
  S.ready={w:false,c:false,t:false}; S.tab="home"; markTab("home");
  S.db=makeDb(S.sb,hid);
  await loadMembers();
  const me=S.members.find(m=>m.user_id===S.uid); $("#who").textContent = me?.display_name ? "Xin chào, "+me.display_name : h.name;
  const snap=(path,key,flag)=> S.db.collection(path).onSnapshot(s=>{ S[key]=s.docs.map(d=>({id:d.id,...d.data()})); S.ready[flag]=true; if(!isTyping()) render(); }, e=>{ S.ready[flag]=true; toast("Không tải được dữ liệu. Kiểm tra mạng."); render(); });
  snap("wallets","wallets","w"); snap("categories","cats","c"); snap("tx","txs","t");
  document.querySelector("nav.tabs").hidden=false;
}
async function chooseHousehold(){
  document.querySelector("nav.tabs").hidden=true;
  const {data}=await S.sb.from("members").select("household_id,households(id,name)").eq("user_id",S.uid);
  const list=(data||[]).map(r=>r.households).filter(Boolean);
  const saved=lsGet("snm_hid");
  if (saved && list.some(h=>h.id===saved)) return openHousehold(saved);
  if (list.length===1) return openHousehold(list[0].id);
  householdView(list);
}

/* tải file trên trình duyệt thường */
const downloads = { async save({filename,data}){ const url=URL.createObjectURL(data instanceof Blob?data:new Blob([data])); const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),10000); return {status:"saved"}; } };

let pendingRender=false;
function isTyping(){ const a=document.activeElement; const t = !!(a && $("#view").contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type!=="file"); if(t) pendingRender=true; return t; }
document.addEventListener("focusout",()=>setTimeout(()=>{ if(pendingRender && !isTyping()){ pendingRender=false; render(); } },150));

async function boot(){
  document.querySelector("nav.tabs").hidden=true;
  if (!CFG.supabaseUrl || !CFG.supabaseAnonKey || !window.supabase){ $("#view").innerHTML=`<div class="card"><h2>Chưa cấu hình kết nối</h2><p class="small muted">Thiếu địa chỉ Supabase trong file config.js.</p></div>`; return; }
  // link "quên mật khẩu" quay về với #...type=recovery; supabase-js xoá hash khi đọc nên phải nhận biết trước
  S.recovery = /type=recovery/.test(location.hash);
  S.sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  let started=false;
  const onSession=async session=>{
    if (!session){ started=false; document.querySelector("nav.tabs").hidden=true; authView(); return; }
    if (started) return; started=true;
    S.uid=session.user.id; S.email=session.user.email;
    if (S.recovery) return passwordView(true);
    chooseHousehold();
  };
  S.sb.auth.onAuthStateChange((e,session)=>{
    if (e==="PASSWORD_RECOVERY"){ S.recovery=true; if(session){ S.uid=session.user.id; S.email=session.user.email; started=true; setTimeout(()=>passwordView(true),0); } return; }
    setTimeout(()=>onSession(session),0);
  });
  const {data}=await S.sb.auth.getSession(); onSession(data.session);
}
boot();
})();
</script>
